<div class="flex justify-between items-center px-5 h-16 w-full">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-purple-900 dark:text-purple-200" data-icon="eco">eco</span>
<span class="font-['Plus_Jakarta_Sans'] font-bold text-lg tracking-tight text-purple-900 dark:text-purple-200 italic text-xl font-extrabold text-purple-900 dark:text-purple-100 italic">Extra Bite</span>
</div>
<div class="w-10 h-10 rounded-full overflow-hidden border-2 border-primary-fixed">
<img alt="User profile photo" class="w-full h-full object-cover" data-alt="Close-up portrait of a stylish young woman with a warm smile, soft natural lighting, elegant and approachable vibe" src="https://lh3.googleusercontent.com/aida-public/AB6AXuAi5BOv4e0P-P0vInALr-928l6oGjqq5Cf5ySSghjcNh9niOCs2q9bhIKmX8NjYE3Z1BxKuCbbZhDjBAn26MQQZjpKpARgfz4xvQzLPb3mMUGY9atRta0jmoMi7Nalen6kTywCtS1a3MjpTmK593Zfld3Ou_vyBlY4wcFwZ8FTbw8IlNYsfOULU-0icp3tGsljH3f8fuqRjUAuTFXv4WNVfTYHUl2eqwP6cCF7_I6nrh_9K3OSeH8dzYv3cNmi7-zMCoFRlckxaIQrG"/>
</div>
</div>
</header>
<main class="pt-24 px-container-padding max-w-2xl mx-auto">
<!-- Profile Header Section -->
<section class="flex flex-col items-center mb-8">
<h1 class="font-headline-lg text-headline-lg text-on-surface mb-1">Julianne Vibe</h1>
<p class="font-body-md text-label-bold text-outline uppercase tracking-widest">Member since 2023</p>
</section>
<!-- Stats Bento Grid -->
<div class="grid grid-cols-1 md:grid-cols-2 gap-gutter mb-md">
<!-- Your Contribution Card -->
<div class="bg-surface-container-low rounded-xl p-md ambient-shadow flex flex-col justify-between min-h-[160px]">
<div>
<div class="flex justify-between items-start mb-sm">
<h2 class="font-label-bold text-label-bold text-on-surface-variant uppercase tracking-wide">Your Contribution</h2>
<span class="material-symbols-outlined text-primary" data-icon="volunteer_activism">volunteer_activism</span>
</div>
<div class="flex items-baseline gap-xs">
<span class="font-headline-xl text-headline-xl text-primary">1,450 g</span>
</div>
<p class="font-label-sm text-label-sm text-outline mb-md">Total Food Saved</p>
</div>
<div class="space-y-sm">
<div class="flex justify-between text-label-sm font-label-bold">
<span class="text-on-surface-variant">Monthly Goal</span>
<span class="text-primary">72%</span>
</div>
<div class="h-3 w-full bg-surface-container-highest rounded-full overflow-hidden">
<div class="h-full bg-primary-container w-[72%] rounded-full relative">
<div class="absolute inset-0 progress-sparkle"></div>
</div>
</div>
</div>
</div>

<div>
<div class="flex justify-between items-start mb-sm">

<span class="material-symbols-outlined text-on-tertiary-container" data-icon="payments">payments</span>
</div>
<div class="flex items-baseline gap-xs">
<span class="font-headline-xl text-headline-xl text-on-tertiary-container">$5.25</span>
</div>
<p class="font-label-sm text-label-sm text-outline mb-md">per saved meal</p>
</div>
<div class="bg-tertiary-fixed-dim/20 rounded-lg p-sm flex items-center gap-sm">
<span class="material-symbols-outlined text-on-tertiary-fixed-variant text-sm" data-icon="trending_down">trending_down</span>
<span class="font-label-bold text-label-sm text-on-tertiary-fixed-variant">-42% vs retail price</span>
</div>
</div>
</div>
<!-- Navigation List -->

<span class="material-symbols-outlined" data-icon="receipt_long">receipt_long</span>
</div>

</div>
<span class="material-symbols-outlined text-outline group-hover:text-primary" data-icon="chevron_right">chevron_right</span>
</button>
<div class="mx-md h-px bg-surface-container"></div>
<button class="w-full flex items-center justify-between p-md hover:bg-purple-50 transition-colors active:scale-[0.99] duration-150 group">

<div class="w-10 h-10 rounded-xl bg-purple-50 flex items-center justify-center text-primary">
<span class="material-symbols-outlined" data-icon="credit_card">credit_card</span>
</div>
<span class="font-label-bold text-body-md text-on-surface">Payment Methods</span>
</div>
<span class="material-symbols-outlined text-outline group-hover:text-primary" data-icon="chevron_right">chevron_right</span>
</button>
<div class="mx-md h-px bg-surface-container"></div>
<button class="w-full flex items-center justify-between p-md hover:bg-purple-50 transition-colors active:scale-[0.99] duration-150 group">
<div class="flex items-center gap-md">
<div class="w-10 h-10 rounded-xl bg-purple-50 flex items-center justify-center text-primary">
<span class="material-symbols-outlined" data-icon="tune">tune</span>
</div>
<span class="font-label-bold text-body-md text-on-surface">Preferences</span>
</div>
<span class="material-symbols-outlined text-outline group-hover:text-primary" data-icon="chevron_right">chevron_right</span>
</button>
</div>

<span class="material-symbols-outlined" data-icon="logout">logout</span>
            Sign Out

<div class="flex flex-col items-center justify-center text-slate-400 dark:text-slate-500 px-4 py-1.5 hover:text-purple-600 dark:hover:text-purple-400 active:scale-90 transition-transform duration-150">

<span class="font-['Plus_Jakarta_Sans'] text-[11px] font-semibold tracking-wide">Explore</span>

<span class="material-symbols-outlined mb-1" data-icon="history">history</span>
<span class="font-['Plus_Jakarta_Sans'] text-[11px] font-semibold tracking-wide">History</span>
</div>
<!-- Profile (Active) -->
<div class="flex flex-col items-center justify-center text-purple-800 dark:text-purple-200 bg-purple-50 dark:bg-purple-900/40 rounded-xl px-4 py-1.5 active:scale-90 transition-transform duration-150">
<span class="material-symbols-outlined mb-1" data-icon="person" style="font-variation-settings: 'FILL' 1;">person</span>
<span class="font-['Plus_Jakarta_Sans'] text-[11px] font-semibold tracking-wide">Profile</span>
