<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, viewport-fit=cover" name="viewport"/>
<title>Extra Bite — Explore</title>
<meta name="theme-color" content="#390663"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="Extra Bite"/>
<link rel="manifest" href="/manifest.json"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Be+Vietnam+Pro:wght@400;500;700&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<!-- Leaflet -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script id="tailwind-config">
  tailwind.config = {
    darkMode: "class",
    theme: {
      extend: {
        colors: {
          "surface-container-highest": "#e8e0e8", "surface-variant": "#e8e0e8",
          "secondary-container": "#edd4fe", "surface-container-high": "#eee6ee",
          "primary-container": "#51247a", "on-primary-fixed-variant": "#5d3186",
          "surface-container-lowest": "#ffffff", "on-tertiary": "#ffffff",
          "on-secondary-fixed-variant": "#523f61", "surface-container-low": "#faf1f9",
          "on-surface-variant": "#4b4450", "on-secondary-fixed": "#251433",
          "on-background": "#1e1a20", "surface-container": "#f4ebf3",
          "tertiary-container": "#503700", "secondary-fixed-dim": "#d6bee7",
          "error": "#ba1a1a", "tertiary-fixed": "#ffdea9", "outline": "#7d7481",
          "inverse-surface": "#332f35", "tertiary-fixed-dim": "#e8c17e",
          "on-error": "#ffffff", "inverse-on-surface": "#f7eef6", "surface": "#fff7fd",
          "on-primary-fixed": "#2c0050", "on-primary-container": "#c192ee",
          "on-error-container": "#93000a", "on-secondary": "#ffffff",
          "outline-variant": "#cec3d1", "error-container": "#ffdad6",
          "on-tertiary-fixed": "#271900", "primary-fixed": "#f0dbff",
          "on-secondary-container": "#6d597d", "on-tertiary-container": "#c5a061",
          "surface-dim": "#e0d7df", "secondary": "#6a577a", "tertiary": "#342300",
          "background": "#fff7fd", "primary-fixed-dim": "#ddb7ff",
          "primary": "#390663", "on-primary": "#ffffff", "surface-tint": "#764aa0",
          "on-surface": "#1e1a20", "inverse-primary": "#ddb7ff", "surface-bright": "#fff7fd"
        },
        borderRadius: { "DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px" },
        spacing: { "lg": "40px", "xl": "64px", "md": "24px", "base": "8px", "sm": "12px", "gutter": "16px", "xs": "4px", "container-padding": "20px" },
        fontFamily: { "headline-xl": ["Plus Jakarta Sans"], "headline-lg": ["Plus Jakarta Sans"], "label-bold": ["Be Vietnam Pro"], "body-md": ["Be Vietnam Pro"], "label-sm": ["Be Vietnam Pro"], "headline-md": ["Plus Jakarta Sans"], "body-lg": ["Be Vietnam Pro"] },
        fontSize: {
          "headline-xl": ["40px", { lineHeight: "1.2", letterSpacing: "-0.02em", fontWeight: "800" }],
          "headline-lg": ["32px", { lineHeight: "1.3", letterSpacing: "-0.01em", fontWeight: "700" }],
          "label-bold": ["14px", { lineHeight: "1.2", fontWeight: "700" }],
          "body-md": ["16px", { lineHeight: "1.5", fontWeight: "400" }],
          "label-sm": ["12px", { lineHeight: "1.2", fontWeight: "500" }],
          "headline-md": ["24px", { lineHeight: "1.4", fontWeight: "700" }],
          "body-lg": ["18px", { lineHeight: "1.6", fontWeight: "400" }]
        }
      }
    }
  }
</script>
<style>
  html, body { height: 100%; margin: 0; background: #fff7fd; overflow: hidden; }
  .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
  .app-shell { height: 100svh; height: 100dvh; position: relative; }

  /* Leaflet map fills between header (64px) and nav (80px) */
  #map {
    position: absolute;
    top: 64px;
    bottom: 80px;
    left: 0;
    right: 0;
    z-index: 0;
  }

  /* Custom pin styles */
  .eb-pin-wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .eb-pin {
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 50%;
    border: 3px solid white;
    box-shadow: 0 4px 12px rgba(57, 6, 99, 0.28);
    transition: transform 0.15s ease;
    width: 36px;
    height: 36px;
    cursor: pointer;
  }
  .eb-pin:active { transform: scale(1.15); }
  .eb-pin-primary {
    background: #390663;
    color: white;
    border-width: 4px;
    width: 42px;
    height: 42px;
    box-shadow: 0 6px 16px rgba(57, 6, 99, 0.35);
  }
  .eb-pin-secondary {
    background: #edd4fe;
    color: #51247a;
  }
  .eb-pin .material-symbols-outlined {
    font-size: 18px;
    font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
  }
  .eb-pin-primary .material-symbols-outlined { font-size: 20px; }
  .eb-tail { width: 2px; height: 10px; background: rgba(255,255,255,0.75); }

  /* Leaflet attribution tweak */
  .leaflet-control-attribution {
    font-size: 9px !important;
    opacity: 0.65;
    background: rgba(255,255,255,0.7) !important;
  }
  .leaflet-attribution-flag { display: none !important; }

  /* Location card animation */
  #location-card {
    transition: opacity 0.2s ease, transform 0.22s ease;
  }
  #location-card.card-hidden {
    opacity: 0;
    transform: translateY(16px);
    pointer-events: none;
  }
  #location-card.card-visible {
    opacity: 1;
    transform: translateY(0);
    pointer-events: auto;
  }
</style>
</head>
<body class="bg-background text-on-background font-body-md">

<!-- TopAppBar -->
<header class="fixed top-0 w-full z-50 bg-white/92 border-b border-purple-100/40 shadow-[0_2px_12px_rgba(81,36,122,0.05)] flex justify-between items-center px-5 h-16">
  <div class="flex items-center gap-2">
    <span class="material-symbols-outlined text-purple-900">eco</span>
    <span class="font-['Plus_Jakarta_Sans'] font-extrabold text-xl italic tracking-tight text-purple-900">Extra Bite</span>
  </div>
  <div class="flex items-center gap-4">
    <button class="w-10 h-10 rounded-full bg-surface-container-highest flex items-center justify-center hover:bg-purple-50 transition-colors active:scale-95 duration-200">
      <span class="material-symbols-outlined text-purple-900">notifications</span>
    </button>
    <a href="/profile" class="w-10 h-10 rounded-full border-2 border-primary-container overflow-hidden block">
      <img alt="Profile" class="w-full h-full object-cover" src="/photos/simple-user-default-icon-free-png.webp"/>
    </a>
  </div>
</header>

<!-- Main canvas -->
<main class="app-shell w-full" id="map-outer">

  <!-- Leaflet interactive map -->
  <div id="map"></div>

  <!-- Search Bar (floats over map) -->
  <div class="absolute top-[76px] left-1/2 -translate-x-1/2 w-[90%] max-w-sm z-10">
    <div class="relative">
      <div class="absolute inset-y-0 left-4 flex items-center pointer-events-none">
        <span class="material-symbols-outlined text-slate-400">search</span>
      </div>
      <input class="w-full h-12 pl-12 pr-4 bg-white/96 border border-white/70 rounded-full shadow-[0_8px_24px_rgba(81,36,122,0.08)] focus:ring-2 focus:ring-primary-container text-body-md font-label-bold transition-all" placeholder="Search UQ St Lucia..." type="text" value="UQ St Lucia, Union Complex"/>
      <div class="absolute inset-y-0 right-4 flex items-center">
        <span class="material-symbols-outlined text-primary-container">tune</span>
      </div>
    </div>
  </div>

  <!-- Location Card (hidden by default) -->
  <div id="location-card" class="card-hidden absolute bottom-24 left-0 w-full px-4 z-30">
    <div class="relative bg-white/96 rounded-[16px] shadow-[0_14px_32px_rgba(81,36,122,0.12)] overflow-hidden flex flex-col max-w-[380px] mx-auto border border-white/70">
      <!-- Close button -->
      <button onclick="hideCard()" class="absolute top-2 right-2 z-10 w-7 h-7 bg-black/20 hover:bg-black/30 rounded-full flex items-center justify-center transition-colors active:scale-90">
        <span class="material-symbols-outlined text-white text-[16px]">close</span>
      </button>
      <div class="h-16 relative flex-shrink-0">
        <img class="w-full h-full object-cover" src="/photos/pic-1.jpg" alt="UQ Food Chains"/>
        <div class="absolute top-2 left-2 bg-white/95 px-1.5 py-0.5 rounded-md flex items-center gap-0.5 shadow-[0_2px_8px_rgba(0,0,0,0.08)]">
          <span class="material-symbols-outlined text-[12px] text-amber-500" style="font-variation-settings:'FILL' 1;">star</span>
          <span class="text-[11px] font-bold text-on-surface">4.8</span>
        </div>
      </div>
      <div class="px-3 py-2 flex-grow">
        <div class="flex items-center justify-between gap-2 mb-0.5">
          <h2 class="text-[14px] leading-tight font-['Plus_Jakarta_Sans'] font-bold text-primary">UQ Food Chains</h2>
          <span class="shrink-0 text-[10px] font-label-bold text-on-secondary-container bg-secondary-container px-1.5 py-0.5 rounded-full">250m away</span>
        </div>
        <p class="text-[11px] text-on-surface-variant flex items-center gap-0.5 mb-1.5">
          <span class="material-symbols-outlined text-[12px]">location_on</span>
          Union Complex, St Lucia Campus
        </p>
        <div class="flex items-center justify-between gap-2">
          <div class="flex items-baseline gap-1.5">
            <span class="text-[11px] text-outline line-through">$18.50</span>
            <span class="text-[17px] leading-none font-bold text-on-tertiary-container">$7.50</span>
          </div>
          <a href="/meal" class="bg-primary text-on-primary px-3 py-1.5 rounded-full text-[12px] font-label-bold shadow-[0_8px_16px_rgba(57,6,99,0.16)] hover:scale-[1.01] active:scale-95 transition-all flex items-center gap-1 no-underline">
            Claim Bite
            <span class="material-symbols-outlined text-[14px]">bolt</span>
          </a>
        </div>
      </div>
    </div>
  </div>
</main>

<!-- BottomNavBar -->
<nav class="fixed bottom-0 left-0 w-full h-20 bg-white/96 border-t border-purple-100 flex justify-around items-center px-4 shadow-[0_-2px_12px_rgba(81,36,122,0.06)] z-50" style="padding-bottom: env(safe-area-inset-bottom)">
  <a href="/explore" class="flex flex-col items-center justify-center text-purple-800 bg-purple-50 rounded-xl px-4 py-1.5 active:scale-90 transition-transform duration-150 no-underline">
    <span class="material-symbols-outlined" style="font-variation-settings:'FILL' 1;">explore</span>
    <span class="font-['Plus_Jakarta_Sans'] text-[11px] font-semibold tracking-wide">Explore</span>
  </a>
  <a href="/history" class="flex flex-col items-center justify-center text-slate-400 px-4 py-1.5 hover:text-purple-600 active:scale-90 transition-transform duration-150 no-underline">
    <span class="material-symbols-outlined">bookmark</span>
    <span class="font-['Plus_Jakarta_Sans'] text-[11px] font-semibold tracking-wide">Saved</span>
  </a>
  <a href="/history" class="flex flex-col items-center justify-center text-slate-400 px-4 py-1.5 hover:text-purple-600 active:scale-90 transition-transform duration-150 no-underline">
    <span class="material-symbols-outlined">history</span>
    <span class="font-['Plus_Jakarta_Sans'] text-[11px] font-semibold tracking-wide">History</span>
  </a>
  <a href="/profile" class="flex flex-col items-center justify-center text-slate-400 px-4 py-1.5 hover:text-purple-600 active:scale-90 transition-transform duration-150 no-underline">
    <span class="material-symbols-outlined">person</span>
    <span class="font-['Plus_Jakarta_Sans'] text-[11px] font-semibold tracking-wide">Profile</span>
  </a>
</nav>

<script>
  /* ── Leaflet map ── */
  const map = L.map('map', {
    center: [-27.4975, 153.0137],
    zoom: 17,
    zoomControl: false,        // no default ± buttons; use pinch / scroll
    attributionControl: true,
    tap: true,                 // better mobile tap handling
  });

  L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
    attribution: '&copy; <a href="https://openstreetmap.org/copyright">OSM</a> &copy; <a href="https://carto.com/">CARTO</a>',
    maxZoom: 20,
    subdomains: 'abcd',
  }).addTo(map);

  /* ── Custom icon builder ── */
  function makeIcon(iconName, primary) {
    const size   = primary ? 42 : 36;
    const anchor = primary ? size + 12 : size;
    const html = `
      <div class="eb-pin-wrap">
        <div class="eb-pin ${primary ? 'eb-pin-primary' : 'eb-pin-secondary'}">
          <span class="material-symbols-outlined">${iconName}</span>
        </div>
        ${primary ? '<div class="eb-tail"></div>' : ''}
      </div>`;
    return L.divIcon({
      html,
      className: '',
      iconSize:   [size, anchor],
      iconAnchor: [size / 2, anchor],
    });
  }

  /* ── Pin data (UQ St Lucia + surrounds) ── */
  const pins = [
    // Primary — shows the card
    { lat: -27.4975, lng: 153.0137, icon: 'restaurant',    primary: true  },

    // UQ core campus
    { lat: -27.4962, lng: 153.0148, icon: 'coffee'         },
    { lat: -27.4988, lng: 153.0155, icon: 'bakery_dining'  },
    { lat: -27.4972, lng: 153.0110, icon: 'ramen_dining'   },
    { lat: -27.4984, lng: 153.0128, icon: 'lunch_dining'   },
    { lat: -27.4955, lng: 153.0140, icon: 'local_pizza'    },
    { lat: -27.4993, lng: 153.0143, icon: 'fastfood'       },
    { lat: -27.4967, lng: 153.0162, icon: 'set_meal'       },

    // Further around campus
    { lat: -27.4978, lng: 153.0099, icon: 'coffee'         },
    { lat: -27.5002, lng: 153.0120, icon: 'bakery_dining'  },
    { lat: -27.4948, lng: 153.0126, icon: 'local_cafe'     },
    { lat: -27.4959, lng: 153.0172, icon: 'ramen_dining'   },
    { lat: -27.5007, lng: 153.0138, icon: 'lunch_dining'   },
    { lat: -27.4951, lng: 153.0100, icon: 'fastfood'       },
    { lat: -27.4942, lng: 153.0151, icon: 'local_pizza'    },
    { lat: -27.4933, lng: 153.0131, icon: 'set_meal'       },
    { lat: -27.5014, lng: 153.0155, icon: 'coffee'         },
    { lat: -27.4938, lng: 153.0113, icon: 'bakery_dining'  },
    { lat: -27.5020, lng: 153.0108, icon: 'ramen_dining'   },
    { lat: -27.4928, lng: 153.0162, icon: 'fastfood'       },
  ];

  pins.forEach(({ lat, lng, icon, primary }) => {
    const marker = L.marker([lat, lng], { icon: makeIcon(icon, !!primary) }).addTo(map);

    if (primary) {
      marker.on('click', (e) => {
        L.DomEvent.stopPropagation(e);
        showCard();
      });
    } else {
      marker.on('click', (e) => {
        L.DomEvent.stopPropagation(e);
        window.location.href = '/meal';
      });
    }
  });

  /* Clicking bare map closes the card */
  map.on('click', hideCard);

  /* ── Card toggle ── */
  const card = document.getElementById('location-card');

  function showCard() {
    card.classList.remove('card-hidden');
    card.classList.add('card-visible');
  }

  function hideCard() {
    card.classList.remove('card-visible');
    card.classList.add('card-hidden');
  }
</script>

</body>
</html>
