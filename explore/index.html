<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, viewport-fit=cover" name="viewport"/>
<title>Extra Bite — Explore</title>
<meta name="theme-color" content="#390663"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="Extra Bite"/>
<link rel="manifest" href="/manifest.json"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Be+Vietnam+Pro:wght@400;500;700&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script id="tailwind-config">
  tailwind.config = {
    darkMode: "class",
    theme: {
      extend: {
        colors: {
          "surface-container-highest": "#e8e0e8", "surface-variant": "#e8e0e8",
          "secondary-container": "#edd4fe", "surface-container-high": "#eee6ee",
          "primary-container": "#51247a", "on-primary-fixed-variant": "#5d3186",
          "surface-container-lowest": "#ffffff", "on-tertiary": "#ffffff",
          "on-secondary-fixed-variant": "#523f61", "surface-container-low": "#faf1f9",
          "on-surface-variant": "#4b4450", "on-secondary-fixed": "#251433",
          "on-background": "#1e1a20", "surface-container": "#f4ebf3",
          "tertiary-container": "#503700", "secondary-fixed-dim": "#d6bee7",
          "error": "#ba1a1a", "tertiary-fixed": "#ffdea9", "outline": "#7d7481",
          "inverse-surface": "#332f35", "tertiary-fixed-dim": "#e8c17e",
          "on-error": "#ffffff", "inverse-on-surface": "#f7eef6", "surface": "#fff7fd",
          "on-primary-fixed": "#2c0050", "on-primary-container": "#c192ee",
          "on-error-container": "#93000a", "on-secondary": "#ffffff",
          "outline-variant": "#cec3d1", "error-container": "#ffdad6",
          "on-tertiary-fixed": "#271900", "primary-fixed": "#f0dbff",
          "on-secondary-container": "#6d597d", "on-tertiary-container": "#c5a061",
          "surface-dim": "#e0d7df", "secondary": "#6a577a", "tertiary": "#342300",
          "background": "#fff7fd", "primary-fixed-dim": "#ddb7ff",
          "primary": "#390663", "on-primary": "#ffffff", "surface-tint": "#764aa0",
          "on-surface": "#1e1a20", "inverse-primary": "#ddb7ff", "surface-bright": "#fff7fd"
        },
        borderRadius: { "DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px" },
        spacing: { "lg": "40px", "xl": "64px", "md": "24px", "base": "8px", "sm": "12px", "gutter": "16px", "xs": "4px", "container-padding": "20px" },
        fontFamily: { "headline-xl": ["Plus Jakarta Sans"], "headline-lg": ["Plus Jakarta Sans"], "label-bold": ["Be Vietnam Pro"], "body-md": ["Be Vietnam Pro"], "label-sm": ["Be Vietnam Pro"], "headline-md": ["Plus Jakarta Sans"], "body-lg": ["Be Vietnam Pro"] },
        fontSize: {
          "headline-xl": ["40px", { lineHeight: "1.2", letterSpacing: "-0.02em", fontWeight: "800" }],
          "headline-lg": ["32px", { lineHeight: "1.3", letterSpacing: "-0.01em", fontWeight: "700" }],
          "label-bold": ["14px", { lineHeight: "1.2", fontWeight: "700" }],
          "body-md": ["16px", { lineHeight: "1.5", fontWeight: "400" }],
          "label-sm": ["12px", { lineHeight: "1.2", fontWeight: "500" }],
          "headline-md": ["24px", { lineHeight: "1.4", fontWeight: "700" }],
          "body-lg": ["18px", { lineHeight: "1.6", fontWeight: "400" }]
        }
      }
    }
  }
</script>
<style>
  html, body { height: 100%; margin: 0; background: #fff7fd; overflow: hidden; }
  .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
  .app-shell { height: 100svh; height: 100dvh; position: relative; }

  #map {
    position: absolute;
    top: 64px;
    bottom: 80px;
    left: 0;
    right: 0;
    z-index: 0;
  }

  /* Pin: same style for every location */
  .eb-pin-wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    cursor: pointer;
  }
  .eb-pin {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 42px;
    height: 42px;
    border-radius: 50%;
    background: #390663;
    color: white;
    border: 4px solid white;
    box-shadow: 0 6px 16px rgba(57, 6, 99, 0.38);
    transition: transform 0.15s ease;
  }
  .eb-pin:active { transform: scale(1.15); }
  .eb-pin .material-symbols-outlined {
    font-size: 20px;
    font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
  }
  .eb-tail {
    width: 2px;
    height: 10px;
    background: rgba(57, 6, 99, 0.5);
  }

  .leaflet-control-attribution {
    font-size: 9px !important;
    opacity: 0.6;
    background: rgba(255,255,255,0.7) !important;
  }
  .leaflet-attribution-flag { display: none !important; }

  /* Card animation */
  #location-card {
    transition: opacity 0.2s ease, transform 0.22s ease;
  }
  #location-card.card-hidden {
    opacity: 0;
    transform: translateY(16px);
    pointer-events: none;
  }
  #location-card.card-visible {
    opacity: 1;
    transform: translateY(0);
    pointer-events: auto;
  }
</style>
</head>
<body class="bg-background text-on-background font-body-md">

<!-- TopAppBar -->
<header class="fixed top-0 w-full z-50 bg-white/92 border-b border-purple-100/40 shadow-[0_2px_12px_rgba(81,36,122,0.05)] flex justify-between items-center px-5 h-16">
  <div class="flex items-center gap-2">
    <span class="material-symbols-outlined text-purple-900">eco</span>
    <span class="font-['Plus_Jakarta_Sans'] font-extrabold text-xl italic tracking-tight text-purple-900">Extra Bite</span>
  </div>
  <div class="flex items-center gap-4">
    <button class="w-10 h-10 rounded-full bg-surface-container-highest flex items-center justify-center hover:bg-purple-50 transition-colors active:scale-95 duration-200">
      <span class="material-symbols-outlined text-purple-900">notifications</span>
    </button>
    <a href="/profile" class="w-10 h-10 rounded-full border-2 border-primary-container overflow-hidden block">
      <img alt="Profile" class="w-full h-full object-cover" src="/photos/simple-user-default-icon-free-png.webp"/>
    </a>
  </div>
</header>

<main class="app-shell w-full">

  <!-- Leaflet map -->
  <div id="map"></div>

  <!-- Search bar -->
  <div class="absolute top-[76px] left-1/2 -translate-x-1/2 w-[90%] max-w-sm z-10">
    <div class="relative">
      <div class="absolute inset-y-0 left-4 flex items-center pointer-events-none">
        <span class="material-symbols-outlined text-slate-400">search</span>
      </div>
      <input id="search-input"
        class="w-full h-12 pl-12 pr-12 bg-white/96 border border-white/70 rounded-full shadow-[0_8px_24px_rgba(81,36,122,0.08)] focus:ring-2 focus:ring-primary-container text-body-md font-label-bold transition-all"
        placeholder="Search a location..."
        type="text"
        onkeydown="if(event.key==='Enter'){searchLocation(this.value);this.blur();}"/>
      <button id="location-btn" onclick="useCurrentLocation()"
        title="Use my current location"
        class="absolute inset-y-0 right-0 w-12 flex items-center justify-center rounded-full hover:bg-purple-50 active:scale-90 transition-all">
        <span class="material-symbols-outlined text-primary text-[22px]" style="font-variation-settings:'FILL' 1;">my_location</span>
      </button>
    </div>
    <!-- Toast notification -->
    <div id="search-toast"
      class="mt-2 mx-1 text-center text-[12px] font-semibold text-white bg-[#1e1a20dd] rounded-full px-4 py-1.5 shadow opacity-0 transition-opacity duration-300 pointer-events-none select-none">
    </div>
  </div>

  <!-- Location card (single element, content updated by JS) -->
  <div id="location-card" class="card-hidden absolute bottom-24 left-0 w-full px-4 z-30">
    <div class="relative bg-white/96 rounded-[16px] shadow-[0_14px_32px_rgba(81,36,122,0.12)] overflow-hidden flex flex-col max-w-[380px] mx-auto border border-white/70">
      <button onclick="hideCard()" class="absolute top-2 right-2 z-10 w-7 h-7 bg-black/20 hover:bg-black/30 rounded-full flex items-center justify-center transition-colors active:scale-90">
        <span class="material-symbols-outlined text-white text-[16px]">close</span>
      </button>
      <div class="h-16 relative flex-shrink-0">
        <img id="card-photo" class="w-full h-full object-cover" src="" alt=""/>
        <div class="absolute top-2 left-2 bg-white/95 px-1.5 py-0.5 rounded-md flex items-center gap-0.5 shadow-[0_2px_8px_rgba(0,0,0,0.08)]">
          <span class="material-symbols-outlined text-[12px] text-amber-500" style="font-variation-settings:'FILL' 1;">star</span>
          <span id="card-rating" class="text-[11px] font-bold text-on-surface"></span>
        </div>
      </div>
      <div class="px-3 py-2 flex-grow">
        <div class="flex items-center justify-between gap-2 mb-0.5">
          <h2 id="card-name" class="text-[14px] leading-tight font-['Plus_Jakarta_Sans'] font-bold text-primary"></h2>
          <span id="card-distance" class="shrink-0 text-[10px] font-label-bold text-on-secondary-container bg-secondary-container px-1.5 py-0.5 rounded-full"></span>
        </div>
        <p class="text-[11px] text-on-surface-variant flex items-center gap-0.5 mb-1.5">
          <span class="material-symbols-outlined text-[12px]">location_on</span>
          <span id="card-address"></span>
        </p>
        <div class="flex items-center justify-between gap-2">
          <div class="flex items-baseline gap-1.5">
            <span id="card-original-price" class="text-[11px] text-outline line-through"></span>
            <span id="card-price" class="text-[17px] leading-none font-bold text-on-tertiary-container"></span>
          </div>
          <a href="/meal" class="bg-primary text-on-primary px-3 py-1.5 rounded-full text-[12px] font-label-bold shadow-[0_8px_16px_rgba(57,6,99,0.16)] hover:scale-[1.01] active:scale-95 transition-all flex items-center gap-1 no-underline">
            Claim Bite
            <span class="material-symbols-outlined text-[14px]">bolt</span>
          </a>
        </div>
      </div>
    </div>
  </div>
</main>

<!-- BottomNavBar -->
<nav class="fixed bottom-0 left-0 w-full h-20 bg-white/96 border-t border-purple-100 flex justify-around items-center px-4 shadow-[0_-2px_12px_rgba(81,36,122,0.06)] z-50" style="padding-bottom: env(safe-area-inset-bottom)">
  <a href="/explore" class="flex flex-col items-center justify-center text-purple-800 bg-purple-50 rounded-xl px-4 py-1.5 active:scale-90 transition-transform duration-150 no-underline">
    <span class="material-symbols-outlined" style="font-variation-settings:'FILL' 1;">explore</span>
    <span class="font-['Plus_Jakarta_Sans'] text-[11px] font-semibold tracking-wide">Explore</span>
  </a>
  <a href="/history" class="flex flex-col items-center justify-center text-slate-400 px-4 py-1.5 hover:text-purple-600 active:scale-90 transition-transform duration-150 no-underline">
    <span class="material-symbols-outlined">bookmark</span>
    <span class="font-['Plus_Jakarta_Sans'] text-[11px] font-semibold tracking-wide">Saved</span>
  </a>
  <a href="/history" class="flex flex-col items-center justify-center text-slate-400 px-4 py-1.5 hover:text-purple-600 active:scale-90 transition-transform duration-150 no-underline">
    <span class="material-symbols-outlined">history</span>
    <span class="font-['Plus_Jakarta_Sans'] text-[11px] font-semibold tracking-wide">History</span>
  </a>
  <a href="/profile" class="flex flex-col items-center justify-center text-slate-400 px-4 py-1.5 hover:text-purple-600 active:scale-90 transition-transform duration-150 no-underline">
    <span class="material-symbols-outlined">person</span>
    <span class="font-['Plus_Jakarta_Sans'] text-[11px] font-semibold tracking-wide">Profile</span>
  </a>
</nav>

<script>
  /* ── Map ── */
  const map = L.map('map', {
    center: [-27.502, 153.020],
    zoom: 12,
    zoomControl: false,
    tap: true,
  });

  L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
    attribution: '&copy; <a href="https://openstreetmap.org/copyright">OSM</a> &copy; <a href="https://carto.com/">CARTO</a>',
    maxZoom: 20,
    subdomains: 'abcd',
  }).addTo(map);

  /* ── Pin icon (same for every location) ── */
  const pinIcon = L.divIcon({
    html: `
      <div class="eb-pin-wrap">
        <div class="eb-pin">
          <span class="material-symbols-outlined">restaurant</span>
        </div>
        <div class="eb-tail"></div>
      </div>`,
    className: '',
    iconSize:   [42, 54],
    iconAnchor: [21, 54],
  });

  /* ── Location data ── */
  const locations = [
    {
      lat: -27.4975, lng: 153.0137,
      name:          'UQ Food Chains',
      address:       'Union Complex, Ground Floor, St Lucia',
      rating:        4.8,
      distance:      '250m away',
      price:         7.50,
      originalPrice: 18.50,
      photo:         '/photos/pic-1.jpg',
    },
    {
      lat: -27.5687, lng: 153.0165,
      name:          'Griffith Food Court',
      address:       'Nathan Campus, Griffith University',
      rating:        4.6,
      distance:      '8.2km away',
      price:         6.50,
      originalPrice: 16.00,
      photo:         '/photos/Griffifth university.jpg',
    },
    {
      lat: -27.4769, lng: 153.0280,
      name:          'QUT Food Court',
      address:       'Gardens Point Campus, QUT, Brisbane',
      rating:        4.5,
      distance:      '3.4km away',
      price:         4.99,
      originalPrice: 13.50,
      photo:         '/photos/QUT food court.jpg',
    },
    {
      lat: -27.4671, lng: 153.0228,
      name:          'Brisbane CBD Food Court',
      address:       'Wintergarden, Queen St Mall, Brisbane',
      rating:        4.7,
      distance:      '4.1km away',
      price:         5.25,
      originalPrice: 15.00,
      photo:         '/photos/Brisbane CBD Food court.jpg',
    },
  ];

  /* ── Place markers ── */
  locations.forEach((loc) => {
    const marker = L.marker([loc.lat, loc.lng], { icon: pinIcon }).addTo(map);
    marker.on('click', (e) => {
      L.DomEvent.stopPropagation(e);
      showCard(loc);
    });
  });

  /* Tap bare map → close card */
  map.on('click', hideCard);

  /* ── Card logic ── */
  const card = document.getElementById('location-card');

  function showCard(loc) {
    document.getElementById('card-photo').src         = loc.photo;
    document.getElementById('card-photo').alt         = loc.name;
    document.getElementById('card-rating').textContent        = loc.rating;
    document.getElementById('card-name').textContent          = loc.name;
    document.getElementById('card-distance').textContent      = loc.distance;
    document.getElementById('card-address').textContent       = loc.address;
    document.getElementById('card-original-price').textContent = `$${loc.originalPrice.toFixed(2)}`;
    document.getElementById('card-price').textContent         = `$${loc.price.toFixed(2)}`;
    card.classList.remove('card-hidden');
    card.classList.add('card-visible');
  }

  function hideCard() {
    card.classList.remove('card-visible');
    card.classList.add('card-hidden');
  }

  /* ── Search & location helpers ── */
  const UQ_LAT = -27.4975, UQ_LNG = 153.0137, MAX_KM = 100;

  function haversineKm(lat1, lon1, lat2, lon2) {
    const R = 6371, toRad = d => d * Math.PI / 180;
    const dLat = toRad(lat2 - lat1), dLon = toRad(lon2 - lon1);
    const a = Math.sin(dLat/2)**2 +
              Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLon/2)**2;
    return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
  }

  function showToast(msg, duration = 3500) {
    const t = document.getElementById('search-toast');
    t.textContent = msg;
    t.style.opacity = '1';
    clearTimeout(t._timer);
    t._timer = setTimeout(() => { t.style.opacity = '0'; }, duration);
  }

  function setLocationBtnLoading(loading) {
    const icon = document.querySelector('#location-btn .material-symbols-outlined');
    icon.textContent = loading ? 'sync' : 'my_location';
    icon.style.animation = loading ? 'spin 1s linear infinite' : '';
  }

  /* Geocode typed address → pan map */
  async function searchLocation(query) {
    query = query.trim();
    if (!query) return;
    try {
      const url = `https://nominatim.openstreetmap.org/search?format=json&limit=1&q=${encodeURIComponent(query)}&countrycodes=au`;
      const res  = await fetch(url, { headers: { 'Accept-Language': 'en' } });
      const data = await res.json();
      if (!data.length) { showToast('Location not found — try a different search'); return; }
      const lat = parseFloat(data[0].lat), lng = parseFloat(data[0].lon);
      if (haversineKm(UQ_LAT, UQ_LNG, lat, lng) > MAX_KM) {
        showToast('That location is more than 100 km from St Lucia');
        return;
      }
      const label = data[0].display_name.split(',').slice(0, 2).join(', ');
      document.getElementById('search-input').value = label;
      map.setView([lat, lng], 15, { animate: true });
    } catch {
      showToast('Search failed — check your connection and try again');
    }
  }

  /* GPS → fill search bar → pan map */
  function useCurrentLocation() {
    if (!navigator.geolocation) { showToast('Geolocation is not supported by your browser'); return; }
    setLocationBtnLoading(true);
    navigator.geolocation.getCurrentPosition(
      async ({ coords: { latitude, longitude } }) => {
        if (haversineKm(UQ_LAT, UQ_LNG, latitude, longitude) > MAX_KM) {
          setLocationBtnLoading(false);
          showToast('Your location is more than 100 km from St Lucia');
          return;
        }
        try {
          const url  = `https://nominatim.openstreetmap.org/reverse?format=json&lat=${latitude}&lon=${longitude}`;
          const res  = await fetch(url, { headers: { 'Accept-Language': 'en' } });
          const data = await res.json();
          const label = data.display_name
            ? data.display_name.split(',').slice(0, 2).join(', ')
            : `${latitude.toFixed(5)}, ${longitude.toFixed(5)}`;
          document.getElementById('search-input').value = label;
        } catch {
          document.getElementById('search-input').value =
            `${latitude.toFixed(5)}, ${longitude.toFixed(5)}`;
        }
        map.setView([latitude, longitude], 16, { animate: true });
        setLocationBtnLoading(false);
      },
      (err) => {
        setLocationBtnLoading(false);
        const msg = err.code === 1
          ? 'Location access denied — enable it in browser settings'
          : 'Could not get your location, please try again';
        showToast(msg);
      },
      { timeout: 10000, maximumAge: 30000 }
    );
  }

  /* Spinning icon animation */
  const style = document.createElement('style');
  style.textContent = '@keyframes spin { to { transform: rotate(360deg); } }';
  document.head.appendChild(style);
</script>

</body>
</html>
